services:
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data   # persist SQLite DB
    env_file:
      - .env

  ui:
    build: .
    command: streamlit run app/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # The UI reaches the API over the compose network, not localhost.
      API_BASE_URL: http://api:8000
    depends_on:
      - api
