[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    # Third-party deprecations we don't control. Anything else stays visible so
    # a deprecation in our own code doesn't accumulate unnoticed.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
