# Pinned explicitly so CI behaves the same across ruff releases.
line-length = 110
target-version = "py310"

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# Depends(...) / Header(...) in argument defaults is the documented FastAPI idiom.
"app/api/main.py" = ["B008"]
# Long single-line f-strings building user-facing insight text. Rewrapping them
# is churn; revisit when this module is next changed.
"app/services/insights.py" = ["E501"]
